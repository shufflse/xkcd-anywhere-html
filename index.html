<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>xkcd anywhere</title>

  <link rel="stylesheet" href="https://unpkg.com/bulma@0.9.0/css/bulma.min.css">

  <style>
    .xkcd-demo img {
      max-width: 40%;
      height: auto;
    }
    pre {
      background: #f5f5f5;
      padding: 1rem;
      overflow-x: auto;
    }
  </style>
</head>

<body class="section">
  <div class="container">

    <h1 class="title">xkcd anywhere</h1>
    <p class="subtitle">
      Embed the latest xkcd comic on any website
    </p>

    <!-- LIVE DEMO -->
    <div class="box xkcd-demo">
      <h2 class="title is-5">Live demo</h2>

      <img id="xkcd-image" alt="">
      <p id="xkcd-alt" class="mt-2"></p>
      <p>
        <a href="https://xkcd.com/" target="_blank" rel="noopener noreferrer">
          View on xkcd.com
        </a>
      </p>
    </div>
    
    <h2 class="title is-5">HTML (copy & paste)</h2>
    <pre><code>&lt;div class="xkcd-widget"&gt;&lt;/div&gt;
&lt;script src="https://shufflse.github.io/xkcd-anywhere-html/xkcd-widget.js" defer&gt;&lt;/script&gt;</code></pre>
  </div>

  <!-- DEMO SCRIPT -->
  <script>
    fetch("https://xkcd.vercel.app/?comic=latest")
      .then(res => res.json())
      .then(data => {
        document.getElementById("xkcd-image").src = data.img;
        document.getElementById("xkcd-image").alt = data.alt;
        document.getElementById("xkcd-alt").textContent = data.alt;
      })
      .catch(err => {
        document.getElementById("xkcd-alt").textContent = "Failed to load xkcd 😢";
        console.error(err);
      });
  </script>

</body>
</html>
